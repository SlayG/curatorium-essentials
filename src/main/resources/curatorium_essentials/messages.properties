# Curatorium Essentials messages.
#
# Edit any line in config/curatorium_essentials/messages.properties, then run /essentials reload.
# Lines you delete fall back to the built-in text, so new messages from updates still show.
#
# Formatting: &0-&9 and &a-&f colours, &l bold, &o italic, &n underline, &m strikethrough,
# &k obfuscated, &r reset, &#RRGGBB any colour. {0}, {1}... are filled in by the mod.

# General
essentials.notInstalled=not installed
essentials.version=&6Curatorium Essentials &c{0}&6, a port of EssentialsX.
essentials.version.luckperms=&6LuckPerms: &c{0}
essentials.version.numismatics=&6Create: Numismatics: &c{0}
essentials.reloaded=&6Curatorium Essentials reloaded.

# Command cooldowns and costs
command.cooldown=&cYou can't use that command for another {0}.
command.cost.cantAfford=&cThat command costs &6{0}&c, and you don't have enough coins on you.
command.cost.paid=&6Paid &c{0}&6.

# Economy
economy.unavailable=&cThe economy is off: Create: Numismatics isn't installed.

# Players
player.notFound=&cPlayer not found.
player.notOnline=&c{0} isn't online.
