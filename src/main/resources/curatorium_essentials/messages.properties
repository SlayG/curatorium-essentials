# Curatorium Essentials messages.
#
# Edit any line in config/curatorium_essentials/messages.properties, then run /essentials reload.
# Lines you delete fall back to the built-in text, so new messages from updates still show.
#
# Formatting: &0-&9 and &a-&f colours, &l bold, &o italic, &n underline, &m strikethrough,
# &k obfuscated, &r reset, &#RRGGBB any colour. {0}, {1}... are filled in by the mod.

# ------------------------------------------------------------------ general
essentials.notInstalled=not installed
essentials.version=&6Curatorium Essentials &c{0}&6, a port of EssentialsX.
essentials.version.luckperms=&6LuckPerms: &c{0}
essentials.version.numismatics=&6Create: Numismatics: &c{0}
essentials.reloaded=&6Curatorium Essentials reloaded.
yes=&ayes
no=&cno
toggle.on=&aon
toggle.off=&coff
toggle.other={0}&6 (for {1}&6)
console.name=&dConsole
console.plainName=Console
page.next=&6Page &c{0}&6 of &c{1}&6. Type &c{2}&6 for the next page.
page.last=&6Page &c{0}&6 of &c{1}&6.
duration.invalid=&c"{0}" isn't a length of time. Use e.g. 30m, 2h, 1d12h.

# ------------------------------------------------------------------ command cooldowns and costs
command.cooldown=&cYou can't use that command for another {0}.
command.cost.cantAfford=&cThat command costs &6{0}&c, and you don't have enough coins on you.
command.cost.paid=&6Paid &c{0}&6.
command.playerOnly=&cOnly players can do that.
command.noPermission=&cYou don't have permission to do that.

# ------------------------------------------------------------------ economy
economy.unavailable=&cThe economy is off: Create: Numismatics isn't installed.

# ------------------------------------------------------------------ players
player.notFound=&cPlayer "{0}" not found.
player.notOnline=&c"{0}" isn't online.

# ------------------------------------------------------------------ chat
# Shown before messages when local chat is on (chat.radius above 0).
chat.type.local=&e[L] &r
chat.type.shout=&6[Shout] &r
chat.type.question=&b[Question] &r
chat.spy=&7[Spy] &r
chat.nobodyHears=&7Nobody is close enough to hear you. Start your message with &f!&7 to shout.

# ------------------------------------------------------------------ private messages
msg.self=&cYou can't message yourself.
msg.disabledTarget={0}&c isn't receiving private messages.
msg.sent=&6[&cme&6 -> &r{0}&6] &r{1}
msg.received=&6[&r{0}&6 -> &cme&6] &r{1}
msg.targetAfk={0}&7 is AFK and may not reply.
msg.targetAfkMessage={0}&7 is AFK: {1}
msg.spy=&7[SocialSpy] &r{0}&7 -> &r{1}&7: {2}
reply.noTarget=&cYou have nobody to reply to.
reply.offline=&cThe person you're replying to isn't online.
rtoggle.state=&6/r replies to the last person you messaged: {0}
msgtoggle.state=&6Blocking private messages: {0}
socialspy.state=&6Social spy: {0}
toggleshout.state=&6Shouting every message: {0}

# ------------------------------------------------------------------ ignore
ignore.none=&6You aren't ignoring anyone.
ignore.list=&6You're ignoring: &r{0}
ignore.self=&cYou can't ignore yourself.
ignore.added=&6You're now ignoring &c{0}&6.
ignore.removed=&6You're no longer ignoring &c{0}&6.
ignore.exempt=&cYou can't ignore {0}.

# ------------------------------------------------------------------ me, helpop, broadcast
me.format=&5* &r{0}&5 {1}
helpop.format=&4[HelpOp] &r{0}&4: &r{1}
helpop.sent=&6Your message was sent to the staff.
broadcast.format=&6[&4Broadcast&6] &a{0}

# ------------------------------------------------------------------ afk
afk.tabSuffix=&7 [AFK]
afk.now=&7* &r{0}&7 is now AFK.
afk.nowMessage=&7* &r{0}&7 is now AFK: {1}
afk.noLonger=&7* &r{0}&7 is no longer AFK.
afk.kick=You were kicked for being AFK too long.

# ------------------------------------------------------------------ mail
mail.unread=&6You have &c{0}&6 unread mail. Type &c/mail read&6 to read it.
mail.none=&6You have no mail.
mail.header=&6--- Mail (page &c{0}&6 of &c{1}&6) ---
mail.line=&7{0}. &6{1}&7 ({2} ago): &r{3}
mail.lineUnread=&7{0}. &c* &6{1}&7 ({2} ago): &r{3}
mail.clearHint=&6Type &c/mail clear&6 to delete your mail, or &c/mail clear <number>&6 for one.
mail.cleared=&6Mail cleared.
mail.clearedOne=&6Deleted mail &c{0}&6.
mail.noSuch=&cYou have no mail number {0}.
mail.tooFast=&cYou're sending mail too fast. Try again in a minute.
mail.received=&6You have new mail from &r{0}&6. Type &c/mail read&6 to read it.
mail.sent=&6Mail sent to &c{0}&6.
mail.sentAll=&6Mail sent to &c{0}&6 players.

# ------------------------------------------------------------------ nicknames
nick.set=&6Your nickname is now &r{0}&6.
nick.setOther=&c{0}&6's nickname is now &r{1}&6.
nick.removed=&6Your nickname was removed.
nick.removedOther=&6Removed &c{0}&6's nickname.
nick.usage=&cUse /nick <nickname|off> or /nick <player> <nickname|off>.
nick.invalid=&cNicknames can only use letters, numbers and _.
nick.tooLong=&cThat nickname is too long (most is {0} characters).
nick.taken=&cThat name is already in use.
realname.none=&cNobody online has that nickname.
realname.result=&r{0}&6 is &c{1}

# ------------------------------------------------------------------ list
list.header=&6There are &c{0}&6 out of a maximum &c{1}&6 players online.
list.players=players
list.group=&6{0}&r: {1}
list.separator=&7, &r
list.afk=&7[AFK]&r

# ------------------------------------------------------------------ text files (motd, rules, info, customtext)
text.chapters=&6Chapters: &c{0}
text.noChapter=&cThere's no chapter called "{0}".
text.empty=&c{0} is empty.

# ------------------------------------------------------------------ help
help.header=&6--- Help (page &c{0}&6 of &c{1}&6) ---
help.line=&6/{0}&f: {1}
help.lineNoDesc=&6/{0}
help.unknown=&cThere's no command /{0} you can use.
help.description=&6{0}
help.usage=&c{0}
help.aliases=&6Also: &f{0}

# Descriptions shown by /help, one per command (help.<command>).
help.essentials=Shows the plugin version, or reloads its files.
help.msg=Sends a private message.
help.r=Replies to your last private message.
help.rtoggle=Changes who /r replies to.
help.msgtoggle=Blocks or allows private messages to you.
help.socialspy=Shows everyone's private messages.
help.ignore=Ignores or unignores a player, or lists who you ignore.
help.me=Describes an action in chat.
help.helpop=Sends a message to the staff.
help.broadcast=Sends a message to everyone.
help.broadcastworld=Sends a message to everyone in your dimension.
help.toggleshout=Makes every message shout (with local chat on).
help.mail=Reads, sends or clears mail.
help.afk=Marks you as away from keyboard.
help.nick=Sets or removes your nickname.
help.realname=Shows who has a nickname.
help.list=Lists who's online.
help.motd=Shows the message of the day.
help.rules=Shows the server rules.
help.info=Shows server information.
help.customtext=Shows custom text.
help.help=Lists the commands you can use.
help.ping=Shows your connection's latency.
help.playtime=Shows how long you've played.
help.seen=Shows when a player was last online.
help.whois=Shows details about a player.
help.getpos=Shows your coordinates.
help.depth=Shows your height compared to sea level.
help.compass=Shows which way you're facing.
help.near=Lists players near you.

